<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gun Smash — Test Playground</title>
<style>
  :root { --bg:#f4f1ea; --ink:#1b1b1f; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:28px 32px 10px; }
  h1 { margin:0 0 4px; font-size:34px; }
  h2 { margin:0 0 10px; font-size:22px; }
  p.lead { margin:0; max-width:760px; color:#444; }
  main { padding:10px 32px 120px; display:grid; gap:26px; }
  section { background:#fff; border:2px solid #ddd; border-radius:14px; padding:20px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .box { width:150px; height:110px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; border:2px solid rgba(0,0,0,.25); }
  .c-white  { background:#fff; color:#222; }
  .c-black  { background:#111; color:#eee; }
  .c-red    { background:#d92b2b; color:#fff; }
  .c-yellow { background:#f4d21c; color:#222; }
  .c-green  { background:#2fa84f; color:#fff; }
  .c-blue   { background:#2b6fd9; color:#fff; }
  .c-purple { background:#8a3fd1; color:#fff; }
  .c-orange { background:#f08a1c; color:#222; }
  .big { width:420px; height:200px; font-size:22px; }
  .tall { width:110px; height:260px; }
  .wide { width:100%; height:80px; }
  .card { width:230px; padding:14px; border:2px solid #ccc; border-radius:10px; background:#fafafa; }
  .img { display:block; width:100%; height:90px; border-radius:6px; background:linear-gradient(135deg,#ff9a3c,#8a3fd1); margin-bottom:8px; }
  button { font:inherit; padding:10px 18px; border-radius:8px; border:2px solid #333; background:#fff; cursor:pointer; }
  input, textarea, select { font:inherit; padding:8px 10px; border:2px solid #999; border-radius:6px; }
  table { border-collapse:collapse; width:100%; }
  td, th { border:1px solid #bbb; padding:8px 12px; text-align:left; }
  th { background:#eee; }
  nav { display:flex; gap:8px; flex-wrap:wrap; }
  nav a { padding:8px 14px; background:#1b1b1f; color:#fff; border-radius:999px; text-decoration:none; }
  .legend { font-size:14px; color:#555; }
  code { background:#eee; padding:1px 6px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>🎃
